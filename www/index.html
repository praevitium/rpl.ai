<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>rpl.ai</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="css/calc.css" />
<link rel="stylesheet" href="vendor/katex/katex.min.css" />
</head>
<body>
  <svg class="icon-sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5l1.7 5.1 5.1 1.7-5.1 1.7L12 17.1l-1.7-5.1-5.1-1.7 5.1-1.7z"/><path d="M18.5 15.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5c-1.9-1.4-4.4-2-7-2v13c2.6 0 5.1.6 7 2 1.9-1.4 4.4-2 7-2v-13c-2.6 0-5.1.6-7 2z"/><path d="M12 6.5v13"/></symbol>
    <symbol id="i-fx" viewBox="0 0 24 24"><path d="M10 4.5c-2.2 0-3 1.2-3.4 3.3L4.8 19.5M3.8 10.5h6"/><path d="M13 11l6 8M19 11l-6 8"/></symbol>
    <symbol id="i-matrix" viewBox="0 0 24 24"><path d="M7.5 4.5h-3v15h3M16.5 4.5h3v15h-3"/><path d="M9.5 9h.01M14.5 9h.01M9.5 15h.01M14.5 15h.01" stroke-width="2.6"/></symbol>
    <symbol id="i-plot" viewBox="0 0 24 24"><path d="M3.5 3.5v17h17"/><path d="M6.5 15.5c2-6.5 3.8-9 5.8-9s2.7 5 4.7 5c1.3 0 2.2-1.8 3-3.8"/></symbol>
    <symbol id="i-omega" viewBox="0 0 24 24"><path d="M5 19h4.5v-1.8a6.5 6.5 0 1 1 5 0V19H19"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2h7.2a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  </svg>
  <!-- Side-panel mount point.  SidePanel (src/ui/side-panel.js) attaches
       its own <aside> here at construction.  Kept as a sibling of the
       calculator so the slide-in overlay can be positioned relative to
       the viewport without being clipped by the bezel's overflow. -->
  <div id="sidePanelRoot"></div>

  <div id="calculator" class="calculator">
    <div class="bezel">
      <div class="brand-row">
        <span class="brand">rpl<span class="model-sub">.ai</span></span>
        <span class="version" id="versionLabel"></span>
        <span class="model">AI-Assisted RPL Calculator</span>
      </div>

      <div class="screen" id="screen" aria-label="LCD display">
        <div class="screen-inner">
          <div class="status-line" id="statusLine">
            <span class="annunciator on" id="ann-angle">RAD</span>
            <!-- Coordinate display mode: XYZ (rect) / R∠Z (cylin) /
                 R∠∠ (sphere).  Click to cycle. -->
            <span class="annunciator on" id="ann-coord">XYZ</span>
            <!-- BinaryInteger display base: HEX / DEC / OCT / BIN.
                 Hidden (empty) when no base override is active. -->
            <span class="annunciator" id="ann-hex"></span>
            <span class="annunciator" id="ann-r"></span>
            <!-- Number display mode: STD / FIX n / SCI n / ENG n.
                 Always lit; updates via the STD/FIX/SCI/ENG ops. -->
            <span class="annunciator on" id="ann-display">STD</span>
            <!-- Real / Complex mode (HP50 flag -103): ℝ when clear,
                 i when set.  Click to toggle; gates SOLVE complex roots
                 and complex-mode transcendental ops. -->
            <span class="annunciator on" id="ann-complex">ℝ</span>
            <span class="annunciator on" id="ann-approx">=</span>
            <span class="annunciator" id="ann-halt"></span>
            <span class="annunciator" id="ann-mode">{ HOME }</span>
          </div>
          <div class="stack-view" id="stackView"></div>
          <div class="suspended-program" id="suspendedProgram" hidden></div>
          <div class="cmdline" id="cmdline"></div>
        </div>
      </div>

      <div class="soft-row" id="softRow">
        <!-- F1..F6 (soft-menu) rendered by src/ui/keyboard.js -->
      </div>

      <div class="nav-row" id="navRow">
        <!-- APPS MODE TOOL / VAR STO▶ NXT + 4-way arrow diamond (right)
             rendered by src/ui/keyboard.js -->
      </div>

      <div class="keypad" id="keypad">
        <!-- Main 5-col keypad (rows 4-10) rendered by src/ui/keyboard.js -->
      </div>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
